[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "bazalt"
version = "0.22.0"
description = "Python library for rapid GPU shader prototyping using Vulkan"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Piotr Szamocki"}]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

[project.urls]
Homepage = "https://github.com/SzamockiP/bazalt"
Repository = "https://github.com/SzamockiP/bazalt"

[project.optional-dependencies]
examples = ["PyGLM"]
# pillow encodes a PNG in memory for the load_image(bytes) test. Without it
# that test skipped in every CI leg, which is a path nobody was covering.
test = ["pytest", "numpy", "pillow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.scikit-build]
wheel.packages = ["bazalt"]
# Without this scikit-build-core builds in a temporary directory and deletes it, so
# every `pip install .` re-configures CMake and rebuilds glfw, volk and vk-bootstrap
# from scratch. A persistent tree makes a rebuild incremental.
build-dir = "build/{wheel_tag}"