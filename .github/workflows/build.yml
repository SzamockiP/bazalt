name: Build

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place, three jobs and every cache key. A bump here re-downloads the SDK
  # on all platforms and invalidates nothing else.
  VULKAN_SDK_VERSION: "1.4.309.0"

  CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"

  # Smoke test on every built wheel: the module imports and the .pyi stub
  # matches __all__. The GPU test suite can't run here (no Vulkan driver
  # in the containers) and stays a local concern.
  CIBW_TEST_REQUIRES: pytest
  CIBW_TEST_COMMAND: python -c "import bazalt" && python -m pytest {project}/tests/test_stubs.py -q

jobs:
  # ── C++ formatting ────────────────────────────────────────────
  # The cheapest job in the file and the only one with no build. Until 0.22 the
  # .clang-format at the root was enforced by remembering to run it, so a release
  # ended with a "style(0.N): clang-format over the release's own code" commit.
  #
  # The version is pinned and comes from PyPI, not apt: clang-format changes its
  # output between major versions, so an unpinned formatter turns somebody else's
  # release into a red build here (the same lesson as tech debt #4).
  format:
    name: Format · clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: pipx install "clang-format==20.1.*"

      - name: Report the formatter version
        run: clang-format --version

      - name: Check src/ against .clang-format
        run: clang-format --dry-run -Werror src/*.hpp src/*.cpp src/bindings/*.hpp src/bindings/*.cpp

  # ── Source distribution ───────────────────────────────────────
  # Published beside the wheels, so `pip install bazalt` on a platform with no
  # wheel builds from source instead of failing with "no matching distribution".
  # There is no separate "does the sdist build" check: wheels_linux builds the
  # same sources from a clean checkout, which is the same proof.
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pipx run build --sdist

      - run: pipx run twine check dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Linux wheels ──────────────────────────────────────────────
  # A job of its own, not a leg of a shared matrix, because test_lavapipe needs
  # only this wheel. Both platforms in one job made the tests wait for Windows
  # too, which finishes about four minutes later and has nothing they use.
  #
  # One job per interpreter, not one job building four wheels in a row. The
  # extension is a single large translation unit and takes about the same time
  # for every interpreter, so four in sequence is four times the wall clock for
  # no reason. In parallel the pipeline costs what one wheel costs. The runners
  # are free on a public repo, so this only spends minutes, not money.
  #
  # A branch push builds the one interpreter the lavapipe legs install. Every
  # event that gates something — a pull request before merge, a release before
  # publish, a manual run — builds all five.
  wheels_linux:
    name: Wheels · linux ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'push' && fromJSON('["cp312"]') || fromJSON('["cp310", "cp311", "cp312", "cp313", "cp314"]') }}
    steps:
      - uses: actions/checkout@v7

      # The SDK is downloaded on the HOST and unpacked in the container, which
      # is what makes it cacheable at all: cibuildwheel copies the project into
      # the container and copies only the wheels back out, so anything the
      # container downloads for itself dies with the container.
      - name: Cache the Vulkan SDK download
        uses: actions/cache@v4
        with:
          path: .vulkan-sdk
          key: vulkan-sdk-linux-${{ env.VULKAN_SDK_VERSION }}

      - name: Download the Vulkan SDK
        env:
          TARBALL: vulkansdk-linux-x86_64-${{ env.VULKAN_SDK_VERSION }}.tar.xz
        run: |
          mkdir -p .vulkan-sdk
          test -f ".vulkan-sdk/$TARBALL" || \
            wget -q "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/linux/$TARBALL" \
              -O ".vulkan-sdk/$TARBALL"

      - uses: pypa/cibuildwheel@v4.1
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          # Unpack the SDK tarball + install the X11/Wayland deps inside the
          # manylinux Docker container (not the host). The cwd is the project,
          # so the tarball the host cached is right there.
          CIBW_BEFORE_ALL_LINUX: |
            set -e
            yum install -y tar xz \
              libX11-devel libXrandr-devel libXinerama-devel \
              libXcursor-devel libXi-devel \
              wayland-devel libxkbcommon-devel
            mkdir -p /opt/vulkan-sdk
            tar xf ".vulkan-sdk/vulkansdk-linux-x86_64-${{ env.VULKAN_SDK_VERSION }}.tar.xz" \
              -C /opt/vulkan-sdk --strip-components=1

          CIBW_ENVIRONMENT_LINUX: >
            VULKAN_SDK=/opt/vulkan-sdk/x86_64
            PATH=/opt/vulkan-sdk/x86_64/bin:$PATH
            LD_LIBRARY_PATH=/opt/vulkan-sdk/x86_64/lib:${LD_LIBRARY_PATH:-}
            CMAKE_PREFIX_PATH=/opt/vulkan-sdk/x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  # ── Windows wheels ────────────────────────────────────────────
  wheels_windows:
    name: Wheels · windows ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'push' && fromJSON('["cp312"]') || fromJSON('["cp310", "cp311", "cp312", "cp313", "cp314"]') }}
    steps:
      - uses: actions/checkout@v7

      # The installer, not the installed tree: the download is what costs
      # minutes, the install itself is fast, and C:\VulkanSDK is far too large
      # to move in and out of the cache every run.
      - name: Cache the Vulkan SDK installer
        uses: actions/cache@v4
        with:
          path: .vulkan-sdk
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}

      # `build-dir = "build/{wheel_tag}"` in pyproject.toml already makes a local
      # rebuild incremental; caching that tree extends it across runs. What it
      # saves is the dependencies, not bazalt: actions/checkout stamps every
      # source file with the current time, so the eight binding TUs recompile
      # regardless, while _deps (glfw, volk, vma, vk-bootstrap, stb) arrives with
      # its cached timestamps and neither re-clones nor rebuilds.
      #
      # Only on the runners that build natively. The Linux wheels are built in a
      # container that cibuildwheel copies the project INTO and copies only the
      # wheels back out of, so nothing written to build/ there ever reaches the
      # host to be saved.
      #
      # The key carries CMakeLists.txt, so any dependency pin bump busts it, and
      # a v-prefix to bust it by hand.
      - name: Cache the CMake build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-v1-windows-${{ matrix.python }}-${{ hashFiles('CMakeLists.txt', 'pyproject.toml') }}
          restore-keys: |
            build-v1-windows-${{ matrix.python }}-

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $VERSION = "${{ env.VULKAN_SDK_VERSION }}"
          New-Item -ItemType Directory -Force .vulkan-sdk | Out-Null
          $INSTALLER = Join-Path $PWD ".vulkan-sdk\VulkanSDK-$VERSION-Installer.exe"
          if (-not (Test-Path $INSTALLER)) {
            Invoke-WebRequest `
              -Uri "https://sdk.lunarg.com/sdk/download/$VERSION/windows/VulkanSDK-$VERSION-Installer.exe" `
              -OutFile $INSTALLER
          }
          Start-Process -FilePath $INSTALLER `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$VERSION" >> $env:GITHUB_ENV

      - uses: pypa/cibuildwheel@v4.1
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS_WINDOWS: AMD64

          # cibuildwheel 4 runs delvewheel by default. bazalt must NOT ship a
          # copy of vulkan-1.dll: volk loads the loader the user's driver
          # installed, and a bundled one would shadow it. Nothing else the
          # extension links is dynamic — shaderc, glfw, volk and vk-bootstrap
          # are all static — so there is no repair left to do.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  # ── macOS wheels ──────────────────────────────────────────────
  # arm64 only. GitHub's x86_64 macOS runners are retired, so an Intel wheel
  # could be cross-compiled but never tested, and an untested wheel is worse
  # than no wheel.
  #
  # The wheel ships no loader and no MoltenVK: macOS has no system Vulkan, so
  # the user installs the SDK. That is the same contract as the other two
  # platforms, where the loader comes with the driver — see DESIGN.md.
  wheels_macos:
    name: Wheels · macos ${{ matrix.python }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'push' && fromJSON('["cp312"]') || fromJSON('["cp310", "cp311", "cp312", "cp313", "cp314"]') }}
    steps:
      - uses: actions/checkout@v7

      # The image's default Xcode is not always its newest, and bazalt needs a
      # recent one: deducing this (the whole pipeline builder), std::jthread and
      # the C++23 range algorithms all arrived in AppleClang later than the rest
      # of C++23. The runner OS does not reach the wheel — the deployment target
      # below decides that — so taking the newest toolchain costs nothing.
      - name: Use the newest Xcode on the image
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          clang --version

      # The SDK archive is cached inside the composite action, which both macOS
      # jobs share.
      - name: Cache the CMake build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-v1-macos-${{ matrix.python }}-${{ hashFiles('CMakeLists.txt', 'pyproject.toml') }}
          restore-keys: |
            build-v1-macos-${{ matrix.python }}-

      - name: Install the Vulkan SDK (MoltenVK, layers, shaderc)
        uses: ./.github/actions/install-vulkan-sdk-macos
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}

      - uses: pypa/cibuildwheel@v4.1
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS_MACOS: arm64

          # 14.0, because libc++ supplies std::format only from 13.3 and the
          # binding layer uses it everywhere. CMakeLists.txt refuses anything
          # lower with that sentence rather than a page of availability errors.
          #
          # Here rather than in CIBW_ENVIRONMENT_MACOS, and the difference is not
          # cosmetic: CIBW_ENVIRONMENT reaches the compiler but not cibuildwheel
          # itself, which computes the WHEEL TAG from its own environment. Set
          # only there, the first macOS wheel compiled against 14.0 and shipped
          # as macosx_11_0_arm64 — a wheel that installs on macOS 11 and then
          # fails to load.
          MACOSX_DEPLOYMENT_TARGET: "14.0"

          CIBW_ENVIRONMENT_MACOS: >
            VULKAN_SDK=$HOME/VulkanSDK/macOS
            CMAKE_PREFIX_PATH=$HOME/VulkanSDK/macOS

          # Same rule as the Windows job: bazalt must not ship a Vulkan loader.
          # volk opens the one the user installed, and a bundled copy would
          # shadow it. The otool step below reports what the extension really
          # links, so this stays a fact rather than an assumption.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""

      - name: Report what the extension links
        run: |
          set -e
          WHEEL=$(ls wheelhouse/*.whl | head -1)
          rm -rf /tmp/wheel-check && mkdir -p /tmp/wheel-check
          unzip -q "$WHEEL" -d /tmp/wheel-check
          otool -L /tmp/wheel-check/bazalt/_core*.so

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  # ── Full GPU suite on lavapipe (Mesa software rasterizer) ─────
  # First CI leg that actually renders: deterministic, no GPU runner needed.
  #
  # Twice, because lavapipe advertises Vulkan 1.3 and bazalt's baseline is 1.2:
  # on the api-1.3 leg dynamic rendering is core, on the api-1.2 leg it comes
  # from VK_KHR_dynamic_rendering and Context aliases the KHR entry points onto
  # the core names. That second path had no coverage anywhere from 0.5 to 0.15
  # (both CI and the dev GPU report 1.3+), which is what made every touch of
  # version negotiation a leap of faith.
  test_lavapipe:
    name: Tests · lavapipe (api ${{ matrix.api }})
    needs: wheels_linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: ["1.3", "1.2"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # cp312 is built on every event, so this name always exists.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cp312
          path: wheelhouse

      # libvulkan1 is the Vulkan LOADER — mesa-vulkan-drivers ships only the
      # ICD, and without the loader every vkCreateInstance fails.
      # Validation layers come from LunarG's repo, not Ubuntu's: noble's
      # 1.3.275 layer does not report shader-access sync hazards at all, which
      # silently guts the manual-barrier negative test.
      - name: Install lavapipe + validation layers
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
          # The installed version DECIDES whether the sync-validation negative
          # test can run: shader-access hazards go unreported before 1.4.350,
          # and noble's newest package is still 1.4.313. Computing the knob here
          # rather than hard-coding it means the test starts running by itself
          # on the day LunarG packages a new enough layer — no repo change, and
          # no test left quietly disabled after one (tech debt #4).
          dpkg -s vulkan-validationlayers | grep -E "^Version"
          VERSION=$(dpkg-query -W -f='${Version}' vulkan-validationlayers)
          if dpkg --compare-versions "$VERSION" ge "1.4.350"; then
            echo "validation layer $VERSION reports shader-access sync hazards"
            echo "BAZALT_SYNCVAL_UNSUPPORTED=0" >> "$GITHUB_ENV"
          else
            echo "validation layer $VERSION is older than 1.4.350: shader-access sync hazards are not reported, so that one negative test skips"
            echo "BAZALT_SYNCVAL_UNSUPPORTED=1" >> "$GITHUB_ENV"
          fi

      # Asked of the package, not hardcoded: the manifest's location has
      # already moved between Ubuntu releases.
      - name: Locate the lavapipe ICD manifest
        run: |
          ICD=$(dpkg -L mesa-vulkan-drivers | grep -E 'lvp.*\.json$' | head -1)
          test -n "$ICD" || { echo "no lavapipe manifest in mesa-vulkan-drivers:"; dpkg -L mesa-vulkan-drivers; exit 1; }
          echo "lavapipe ICD: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"

      - name: Report the Vulkan device CI actually sees
        run: vulkaninfo --summary

      - name: Install wheel + test deps
        run: pip install wheelhouse/bazalt-*-cp312-*manylinux*.whl pytest numpy

      # cwd is OUTSIDE the repo on purpose: the source tree's bazalt/ package
      # has no _core and would shadow the installed wheel on sys.path.
      # VK_ICD_FILENAMES/VK_DRIVER_FILES come from the locate step's GITHUB_ENV.
      #
      # BAZALT_SYNCVAL_UNSUPPORTED comes from the install step, which reads it
      # off the installed layer version instead of asserting one (tech debt #4:
      # 1.4.350 reports shader-access hazards, noble still packages 1.4.313).
      # The debug messenger itself is proven alive by the other tests, so the
      # suite's validation-as-assert is NOT vacuous while that one skips.
      #
      # BAZALT_FORCE_VULKAN_1_2 makes Context negotiate 1.2 even where 1.3 is
      # available — the whole negotiation, not just the aliasing, since a device
      # that never enabled VK_KHR_dynamic_rendering has no KHR entry points to
      # alias to either. A bazalt-side knob rather than MESA_VK_VERSION_OVERRIDE
      # so the same leg is reproducible on any driver, including a dev GPU.
      #
      # --api-coverage on one leg only: it patches every public callable to
      # record the call, and one measurement of the same suite is enough. It
      # reports here and gates nowhere — the gate needs a run with no skips, and
      # lavapipe has no display and not every feature (see conftest.py).
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        env:
          BAZALT_FORCE_VULKAN_1_2: ${{ matrix.api == '1.2' && '1' || '0' }}
          # BAZALT_SYNCVAL_UNSUPPORTED is inherited from GITHUB_ENV.
        run: python -m pytest ${{ github.workspace }}/tests -q ${{ matrix.api == '1.3' && '--api-coverage' || '' }}

      - name: Upload the API coverage report
        if: matrix.api == '1.3'
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: ${{ runner.temp }}/api_coverage.md

  # ── Full GPU suite on MoltenVK (Metal, real hardware) ─────────
  # The acceptance test for 0.22: the release claims bazalt runs on macOS, and
  # this is what makes the claim a fact rather than a wheel that builds. The
  # runner is Apple Silicon, so unlike lavapipe this leg is a real GPU.
  #
  # One leg, not two. lavapipe already runs the 1.2 negotiation on its own leg,
  # and a second one here would buy a slower pipeline and no new path.
  #
  # Expect skips rather than failures where Metal has nothing to offer: no
  # geometry shaders, no wide lines, no shaderFloat64. Every one of those is
  # behind Feature negotiation already, and the tests skip themselves.
  test_moltenvk:
    name: Tests · MoltenVK (Metal)
    needs: wheels_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos-cp312
          path: wheelhouse

      - name: Install the Vulkan SDK (MoltenVK, layers, shaderc)
        uses: ./.github/actions/install-vulkan-sdk-macos
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}

      # Asked of the SDK, not hardcoded, for the reason the lavapipe job gives.
      - name: Locate the MoltenVK ICD manifest and the layers
        run: |
          ICD=$(find "$VULKAN_SDK/share/vulkan/icd.d" -name "*.json" | head -1)
          test -n "$ICD" || { echo "no ICD manifest in the SDK:"; ls -R "$VULKAN_SDK/share/vulkan"; exit 1; }
          echo "MoltenVK ICD: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$VULKAN_SDK/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # Proves a real Metal device answered, rather than the job passing because
      # every GPU test skipped itself.
      - name: Report the Vulkan device CI actually sees
        run: "$VULKAN_SDK/bin/vulkaninfo --summary"

      - name: Install wheel + test deps
        run: pip install wheelhouse/bazalt-*-cp312-*macosx*.whl pytest numpy

      # cwd is OUTSIDE the repo for the reason the lavapipe job gives: the
      # source tree's bazalt/ has no _core and would shadow the wheel.
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        run: python -m pytest ${{ github.workspace }}/tests -q

  # ── Publish to PyPI on release ────────────────────────────────
  publish:
    needs: [wheels_linux, wheels_windows, wheels_macos, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      # By pattern, not everything: the run also carries api_coverage.md, and a
      # markdown file in dist/ is a file the upload has no idea what to do with.
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
