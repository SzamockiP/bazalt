name: Build

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"

  # Smoke test on every built wheel: the module imports and the .pyi stub
  # matches __all__. The GPU test suite can't run here (no Vulkan driver
  # in the containers) and stays a local concern.
  CIBW_TEST_REQUIRES: pytest
  CIBW_TEST_COMMAND: python -c "import bazalt" && python -m pytest {project}/tests/test_stubs.py -q

jobs:
  # ── Linux wheels ──────────────────────────────────────────────
  # A job of its own, not a leg of a shared matrix, because test_lavapipe needs
  # only this wheel. Both platforms in one job made the tests wait for Windows
  # too, which finishes about four minutes later and has nothing they use.
  #
  # One job per interpreter, not one job building four wheels in a row. The
  # extension is a single large translation unit and takes about the same time
  # for every interpreter, so four in sequence is four times the wall clock for
  # no reason. In parallel the pipeline costs what one wheel costs. The runners
  # are free on a public repo, so this only spends minutes, not money.
  #
  # A branch push builds the one interpreter the lavapipe legs install. Every
  # event that gates something — a pull request before merge, a release before
  # publish, a manual run — builds all four.
  wheels_linux:
    name: Wheels · linux ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'push' && fromJSON('["cp312"]') || fromJSON('["cp310", "cp311", "cp312", "cp313"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.1
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          # Install the Vulkan SDK tarball + X11/Wayland deps inside the
          # manylinux Docker container (not the host).
          CIBW_BEFORE_ALL_LINUX: |
            set -e
            VULKAN_VERSION=1.4.309.0
            yum install -y wget tar xz \
              libX11-devel libXrandr-devel libXinerama-devel \
              libXcursor-devel libXi-devel \
              wayland-devel libxkbcommon-devel
            wget -q "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz" \
              -O /tmp/vulkansdk.tar.xz
            mkdir -p /opt/vulkan-sdk
            tar xf /tmp/vulkansdk.tar.xz -C /opt/vulkan-sdk --strip-components=1
            rm /tmp/vulkansdk.tar.xz

          CIBW_ENVIRONMENT_LINUX: >
            VULKAN_SDK=/opt/vulkan-sdk/x86_64
            PATH=/opt/vulkan-sdk/x86_64/bin:$PATH
            LD_LIBRARY_PATH=/opt/vulkan-sdk/x86_64/lib:${LD_LIBRARY_PATH:-}
            CMAKE_PREFIX_PATH=/opt/vulkan-sdk/x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  # ── Windows wheels ────────────────────────────────────────────
  wheels_windows:
    name: Wheels · windows ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'push' && fromJSON('["cp312"]') || fromJSON('["cp310", "cp311", "cp312", "cp313"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $VERSION = "1.4.309.0"
          $INSTALLER = "VulkanSDK-$VERSION-Installer.exe"
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/$VERSION/windows/$INSTALLER" `
            -OutFile $INSTALLER
          Start-Process -FilePath ".\$INSTALLER" `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$VERSION" >> $env:GITHUB_ENV

      - uses: pypa/cibuildwheel@v4.1
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS_WINDOWS: AMD64

          # cibuildwheel 4 runs delvewheel by default. bazalt must NOT ship a
          # copy of vulkan-1.dll: volk loads the loader the user's driver
          # installed, and a bundled one would shadow it. Nothing else the
          # extension links is dynamic — shaderc, glfw, volk and vk-bootstrap
          # are all static — so there is no repair left to do.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  # ── Full GPU suite on lavapipe (Mesa software rasterizer) ─────
  # First CI leg that actually renders: deterministic, no GPU runner needed.
  #
  # Twice, because lavapipe advertises Vulkan 1.3 and bazalt's baseline is 1.2:
  # on the api-1.3 leg dynamic rendering is core, on the api-1.2 leg it comes
  # from VK_KHR_dynamic_rendering and Context aliases the KHR entry points onto
  # the core names. That second path had no coverage anywhere from 0.5 to 0.15
  # (both CI and the dev GPU report 1.3+), which is what made every touch of
  # version negotiation a leap of faith.
  test_lavapipe:
    name: Tests · lavapipe (api ${{ matrix.api }})
    needs: wheels_linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: ["1.3", "1.2"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # cp312 is built on every event, so this name always exists.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-cp312
          path: wheelhouse

      # libvulkan1 is the Vulkan LOADER — mesa-vulkan-drivers ships only the
      # ICD, and without the loader every vkCreateInstance fails.
      # Validation layers come from LunarG's repo, not Ubuntu's: noble's
      # 1.3.275 layer does not report shader-access sync hazards at all, which
      # silently guts the manual-barrier negative test.
      - name: Install lavapipe + validation layers
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
          # The installed version DECIDES whether the sync-validation negative
          # test can run: shader-access hazards go unreported before 1.4.350,
          # and noble's newest package is still 1.4.313. Computing the knob here
          # rather than hard-coding it means the test starts running by itself
          # on the day LunarG packages a new enough layer — no repo change, and
          # no test left quietly disabled after one (tech debt #4).
          dpkg -s vulkan-validationlayers | grep -E "^Version"
          VERSION=$(dpkg-query -W -f='${Version}' vulkan-validationlayers)
          if dpkg --compare-versions "$VERSION" ge "1.4.350"; then
            echo "validation layer $VERSION reports shader-access sync hazards"
            echo "BAZALT_SYNCVAL_UNSUPPORTED=0" >> "$GITHUB_ENV"
          else
            echo "validation layer $VERSION is older than 1.4.350: shader-access sync hazards are not reported, so that one negative test skips"
            echo "BAZALT_SYNCVAL_UNSUPPORTED=1" >> "$GITHUB_ENV"
          fi

      # Asked of the package, not hardcoded: the manifest's location has
      # already moved between Ubuntu releases.
      - name: Locate the lavapipe ICD manifest
        run: |
          ICD=$(dpkg -L mesa-vulkan-drivers | grep -E 'lvp.*\.json$' | head -1)
          test -n "$ICD" || { echo "no lavapipe manifest in mesa-vulkan-drivers:"; dpkg -L mesa-vulkan-drivers; exit 1; }
          echo "lavapipe ICD: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"

      - name: Report the Vulkan device CI actually sees
        run: vulkaninfo --summary

      - name: Install wheel + test deps
        run: pip install wheelhouse/bazalt-*-cp312-*manylinux*.whl pytest numpy

      # cwd is OUTSIDE the repo on purpose: the source tree's bazalt/ package
      # has no _core and would shadow the installed wheel on sys.path.
      # VK_ICD_FILENAMES/VK_DRIVER_FILES come from the locate step's GITHUB_ENV.
      #
      # BAZALT_SYNCVAL_UNSUPPORTED comes from the install step, which reads it
      # off the installed layer version instead of asserting one (tech debt #4:
      # 1.4.350 reports shader-access hazards, noble still packages 1.4.313).
      # The debug messenger itself is proven alive by the other tests, so the
      # suite's validation-as-assert is NOT vacuous while that one skips.
      #
      # BAZALT_FORCE_VULKAN_1_2 makes Context negotiate 1.2 even where 1.3 is
      # available — the whole negotiation, not just the aliasing, since a device
      # that never enabled VK_KHR_dynamic_rendering has no KHR entry points to
      # alias to either. A bazalt-side knob rather than MESA_VK_VERSION_OVERRIDE
      # so the same leg is reproducible on any driver, including a dev GPU.
      - name: Run test suite
        working-directory: ${{ runner.temp }}
        env:
          BAZALT_FORCE_VULKAN_1_2: ${{ matrix.api == '1.2' && '1' || '0' }}
          # BAZALT_SYNCVAL_UNSUPPORTED is inherited from GITHUB_ENV.
        run: python -m pytest ${{ github.workspace }}/tests -q

  # ── Publish to PyPI on release ────────────────────────────────
  publish:
    needs: [wheels_linux, wheels_windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
